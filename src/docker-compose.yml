
services:
  mysql:
    image: mysql:8.0
    container_name: home_automation_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: home_automation
      MYSQL_USER: felipe
      MYSQL_PASSWORD:
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - home_automation_net

networks:
  home_automation_net:
    driver: bridge
