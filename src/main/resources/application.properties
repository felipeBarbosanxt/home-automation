spring.application.name=home-automation

# ------------------------------------------------------
# Database Config
# ------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/home_automation?useSSL=false&serverTimezone=UTC
spring.datasource.username=felipe
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------------------------
# Hibernate Schema Export (gera schema.sql em resources)
# ------------------------------------------------------
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.scripts.action=create
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.scripts.create-target=src/main/resources/schema.sql
